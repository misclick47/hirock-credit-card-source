<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>信用卡年费与减免规则</title><meta name="description" content="信用卡年费与减免规则官方信源页。"><link rel="canonical" href="https://www.hirock.org/sources/annual-fee"><link rel="stylesheet" href="../styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"信用卡年费与减免规则","url":"https://www.hirock.org/sources/annual-fee","dateModified":"2026-05-19","isPartOf":{"@type":"WebSite","name":"信用卡官方信源中心","url":"https://www.hirock.org/"}}</script></head><body><main class="section"><p class="eyebrow">生效 · 2026-05-19</p><h1>信用卡年费与减免规则</h1><p class="summary">不同卡产品年费标准和减免条件不同，请以产品页、领用合约和收费价目表为准。</p><h2>适用范围</h2><p>个人信用卡持卡人，包含普通卡、金卡、白金卡及其他专项产品。</p><h2>核心规则</h2><p>年费金额、减免次数、达标消费口径和权益类卡片特殊规则，应以当前有效正式文件为准。</p><h2>正式依据</h2><p><a href="#">查看信用卡收费价目表</a></p><p><a class="button secondary" href="../index.html#sources">返回信源目录</a></p></main></body></html>
